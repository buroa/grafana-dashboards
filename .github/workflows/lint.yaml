---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Lint - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-dashboards: ${{ steps.changed-dashboards.outputs.changed_files }}
    steps:
      - name: Get Changed Dashboards
        id: changed-dashboards
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          include_only_directories: true
          max_depth: 1
          patterns: "!.github"

  lint:
    if: ${{ needs.filter.outputs.changed-dashboards != '[]' }}
    needs: filter
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dashboard: ${{ fromJSON(needs.filter.outputs.changed-dashboards) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          tool_versions: |
            github:grafana/dashboard-linter latest

      - name: Run Dashboard Linter
        working-directory: ${{ matrix.dashboard }}
        run: dashboard-linter lint --strict dashboard.json

  success:
    if: ${{ !cancelled() }}
    needs: lint
    name: Lint - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
